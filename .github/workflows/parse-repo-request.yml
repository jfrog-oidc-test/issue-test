name: Parse Repo Request

on:
  issues:
    types: [labeled]

jobs:
  parse-issue:
    if: contains(github.event.issue.labels.*.name, 'repo-creation') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      full_name: ${{ steps.parse.outputs.full_name }}
      prefix: ${{ steps.parse.outputs.prefix }}
      repo_name: ${{ steps.parse.outputs.repo_name }}
      product: ${{ steps.parse.outputs.product }}
      tribe: ${{ steps.parse.outputs.tribe }}
      ban_id: ${{ steps.parse.outputs.ban_id }}
      visibility: ${{ steps.parse.outputs.visibility }}
      description: ${{ steps.parse.outputs.description }}

    steps:
      - name: Parse issue body
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 << 'EOF'
          import os
          import re

          body = os.environ.get('ISSUE_BODY', '')

          # Extract full repo name from: **Full repo name:** `prefix-name`
          full_name_match = re.search(r'\*\*Full repo name:\*\*\s*`([^`]+)`', body)
          full_name = full_name_match.group(1) if full_name_match else ''

          # Extract table fields
          def extract_table_field(field_name):
              escaped = re.escape(field_name)
              pattern = rf'\|\s*{escaped}\s*\|\s*`?([^`|]+)`?\s*\|?'
              match = re.search(pattern, body)
              return match.group(1).strip() if match else ''

          prefix = extract_table_field('Repository prefix')
          repo_name = extract_table_field('Repository name')
          product = extract_table_field('Product')
          tribe = extract_table_field('Tribe')
          ban_id = extract_table_field('BAN ID')
          visibility = extract_table_field('Visibility')

          # Extract description from: ### Description\n<text>
          desc_match = re.search(r'###\s*Description\s*\n([\s\S]*?)$', body)
          description = desc_match.group(1).strip() if desc_match else ''

          # Set outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'full_name={full_name}\n')
              f.write(f'prefix={prefix}\n')
              f.write(f'repo_name={repo_name}\n')
              f.write(f'product={product}\n')
              f.write(f'tribe={tribe}\n')
              f.write(f'ban_id={ban_id}\n')
              f.write(f'visibility={visibility}\n')
              f.write(f'description={description}\n')

          # Log parsed values
          print(f'Full Name: {full_name}')
          print(f'Prefix: {prefix}')
          print(f'Repo Name: {repo_name}')
          print(f'Product: {product}')
          print(f'Tribe: {tribe}')
          print(f'BAN ID: {ban_id}')
          print(f'Visibility: {visibility}')
          print(f'Description: {description}')
          EOF

      - name: Validate parsed data
        run: |
          python3 << 'EOF'
          import sys

          fields = {
              'full_name': '${{ steps.parse.outputs.full_name }}',
              'prefix': '${{ steps.parse.outputs.prefix }}',
              'repo_name': '${{ steps.parse.outputs.repo_name }}',
              'product': '${{ steps.parse.outputs.product }}',
              'tribe': '${{ steps.parse.outputs.tribe }}',
              'ban_id': '${{ steps.parse.outputs.ban_id }}',
              'visibility': '${{ steps.parse.outputs.visibility }}',
          }

          print('=== Parsed Issue Data ===')
          for key, val in fields.items():
              print(f'  {key}: {val}')

          missing = [k for k, v in fields.items() if not v]
          if missing:
              for m in missing:
                  print(f'::error::Missing {m}')
              sys.exit(1)
          EOF

  create-repo:
    needs: parse-issue
    runs-on: ubuntu-latest
    steps:
      - name: Create repository and set custom properties
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: jfrog-oidc-test
          REPO_NAME: ${{ needs.parse-issue.outputs.full_name }}
          VISIBILITY: ${{ needs.parse-issue.outputs.visibility }}
          DESCRIPTION: ${{ needs.parse-issue.outputs.description }}
          PRODUCT: ${{ needs.parse-issue.outputs.product }}
          TRIBE: ${{ needs.parse-issue.outputs.tribe }}
          BAN_ID: ${{ needs.parse-issue.outputs.ban_id }}
        run: |
          pip install requests > /dev/null 2>&1
          python3 << 'EOF'
          import os
          import requests
          import sys

          token = os.environ['GH_TOKEN']
          org = os.environ['ORG']
          repo_name = os.environ['REPO_NAME']
          visibility = os.environ['VISIBILITY']
          description = os.environ['DESCRIPTION']
          product = os.environ['PRODUCT']
          tribe = os.environ['TRIBE']
          ban_id = os.environ['BAN_ID']

          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
          }

          # Create repository
          print(f'Creating repo: {org}/{repo_name}')
          resp = requests.post(
              f'https://api.github.com/orgs/{org}/repos',
              headers=headers,
              json={
                  'name': repo_name,
                  'description': description,
                  'visibility': visibility,
                  'auto_init': True,
                  'has_issues': True,
                  'has_projects': False,
                  'has_wiki': False
              }
          )

          if resp.status_code == 201:
              print(f'✓ Repository {org}/{repo_name} created successfully')
          elif resp.status_code == 422 and 'already exists' in resp.text:
              print(f'::warning::Repository {repo_name} already exists, skipping creation')
          else:
              print(f'::error::Failed to create repo: {resp.status_code} {resp.text}')
              sys.exit(1)

          # Ensure custom properties exist at org level
          prop_defs = [
              {'name': 'product', 'description': 'Product name'},
              {'name': 'tribe', 'description': 'Tribe name'},
              {'name': 'ban', 'description': 'BAN ID'}
          ]
          for prop in prop_defs:
              r = requests.put(
                  f'https://api.github.com/orgs/{org}/properties/schema/{prop["name"]}',
                  headers=headers,
                  json={
                      'value_type': 'string',
                      'required': False,
                      'description': prop['description']
                  }
              )
              if r.status_code in (200, 201):
                  print(f'  Property "{prop["name"]}" ensured')
              else:
                  print(f'  Property "{prop["name"]}": {r.status_code} (may already exist)')

          # Set custom property values on the repo
          r = requests.patch(
              f'https://api.github.com/orgs/{org}/properties/values',
              headers=headers,
              json={
                  'repository_names': [repo_name],
                  'properties': [
                      {'property_name': 'product', 'value': product},
                      {'property_name': 'tribe', 'value': tribe},
                      {'property_name': 'ban', 'value': ban_id}
                  ]
              }
          )
          if r.status_code in (200, 204):
              print(f'✓ Custom properties set: product={product}, tribe={tribe}, ban={ban_id}')
          else:
              print(f'::error::Failed to set custom properties: {r.status_code} {r.text}')
              sys.exit(1)
          EOF

  assign-team-access:
    needs: [parse-issue, create-repo]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assign team access to repo
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: jfrog-oidc-test
          REPO_NAME: ${{ needs.parse-issue.outputs.full_name }}
          PRODUCT: ${{ needs.parse-issue.outputs.product }}
        run: |
          pip install requests pyyaml > /dev/null 2>&1
          python3 << 'EOF'
          import os
          import yaml
          import requests
          import sys

          token = os.environ['GH_TOKEN']
          org = os.environ['ORG']
          repo_name = os.environ['REPO_NAME']
          product = os.environ['PRODUCT']

          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
          }

          # Load teams config
          with open('teams-config.yml') as f:
              config = yaml.safe_load(f)

          # Find teams for this product
          team_names = []
          for entry in config.get('teams', []):
              if entry.get('product') == product:
                  for team in entry.get('teams', []):
                      team_names.append(team['name'])
                  break

          if not team_names:
              print(f'::warning::No teams found for product: {product}')
              sys.exit(0)

          print(f'Repo: {org}/{repo_name}')
          print(f'Product: {product}')
          print(f'Teams found: {", ".join(team_names)}')

          # Map team suffix to GitHub repo permission
          def get_permission(name):
              if name.endswith('-Admin'):
                  return 'admin'
              elif name.endswith('-Developer'):
                  return 'push'
              elif name.endswith('-Reader'):
                  return 'pull'
              return 'pull'

          for team_name in team_names:
              permission = get_permission(team_name)
              slug = team_name.lower().replace(' ', '-')

              r = requests.put(
                  f'https://api.github.com/orgs/{org}/teams/{slug}/repos/{org}/{repo_name}',
                  headers=headers,
                  json={'permission': permission}
              )
              if r.status_code in (200, 204):
                  print(f'  ✓ {team_name} → {permission}')
              else:
                  print(f'  ::error::Failed to assign {team_name} ({permission}): {r.status_code} {r.text}')

          print('\nRepo access assignment complete.')
          EOF

  save-repo-registry:
    needs: [parse-issue, create-repo, assign-team-access]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Save repo info to registry
        env:
          REPO_NAME: ${{ needs.parse-issue.outputs.full_name }}
          PRODUCT: ${{ needs.parse-issue.outputs.product }}
        run: |
          pip install pyyaml > /dev/null 2>&1
          python3 << 'EOF'
          import os
          import yaml

          repo_name = os.environ['REPO_NAME']
          product = os.environ['PRODUCT']

          # Load teams config to determine assigned teams
          with open('teams-config.yml') as f:
              config = yaml.safe_load(f)

          teams = []
          for entry in config.get('teams', []):
              if entry.get('product') == product:
                  for team in entry.get('teams', []):
                      teams.append(team['name'])
                  break

          repo_entry = {
              'name': repo_name,
              'teams': teams,
              'cross_team_access': []
          }

          # Load existing registry
          registry_file = 'repos-registry.yml'
          if os.path.exists(registry_file):
              with open(registry_file) as f:
                  registry = yaml.safe_load(f) or {}
          else:
              registry = {}

          repos = registry.get('repositories', [])

          # Check if repo already exists (update instead of duplicate)
          found = False
          for i, r in enumerate(repos):
              if r.get('name') == repo_name:
                  repos[i] = repo_entry
                  found = True
                  break
          if not found:
              repos.append(repo_entry)

          registry['repositories'] = repos

          with open(registry_file, 'w') as f:
              f.write('# Repository Registry — Source of Truth\n')
              f.write('# Auto-updated by GitHub Actions on repo creation, update, and cross-team access grants.\n\n')
              yaml.dump(registry, f, default_flow_style=False, sort_keys=False)

          print(f'✓ Registry updated with repo: {repo_name}')
          EOF

      - name: Commit registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repos-registry.yml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "registry: add ${{ needs.parse-issue.outputs.full_name }} [skip ci]"
          git push

      - name: Comment summary and close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_NAME: ${{ needs.parse-issue.outputs.full_name }}
          PRODUCT: ${{ needs.parse-issue.outputs.product }}
          TRIBE: ${{ needs.parse-issue.outputs.tribe }}
          BAN_ID: ${{ needs.parse-issue.outputs.ban_id }}
          VISIBILITY: ${{ needs.parse-issue.outputs.visibility }}
        run: |
          BODY=$(cat <<'COMMENT'
          ## ✅ Repository Created Successfully

          | Step | Status |
          |------|--------|
          | Repository creation | ✓ Done |
          | Custom properties set | ✓ Done |
          | Team access assigned | ✓ Done |
          | Registry updated | ✓ Done |

          ### Summary
          | Field | Value |
          |-------|-------|
          COMMENT
          )
          BODY="${BODY}
          | Repository | \`${REPO_NAME}\` |
          | Product | ${PRODUCT} |
          | Tribe | ${TRIBE} |
          | BAN ID | ${BAN_ID} |
          | Visibility | ${VISIBILITY} |

          ---
          🔗 [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          gh issue comment $ISSUE_NUMBER --body "$BODY" --repo ${{ github.repository }}
          gh issue close $ISSUE_NUMBER --repo ${{ github.repository }}
