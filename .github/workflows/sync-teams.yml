name: Sync GitHub Teams

on:
  push:
    branches: [main]
    paths:
      - 'teams-config.yml'

jobs:
  sync-teams:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse YAML config
        id: config
        run: |
          sudo apt-get install -y python3-yaml > /dev/null 2>&1
          CONFIG_JSON=$(python3 -c "
          import yaml, json, sys
          with open('teams-config.yml') as f:
              data = yaml.safe_load(f)
          json.dump(data, sys.stdout)
          ")
          echo "json<<EOF" >> $GITHUB_OUTPUT
          echo "$CONFIG_JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create/Update teams from config
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_ADMIN_TOKEN }}
          script: |
            const config = JSON.parse(`${{ steps.config.outputs.json }}`);
            const org = config.org;

            console.log(`Organization: ${org}`);

            for (const product of config.teams) {
              console.log(`\nProduct: ${product.product}`);

              for (const team of product.teams) {
                console.log(`  Processing team: ${team.name}`);

                try {
                  // Check if team already exists
                  const slug = team.name.toLowerCase().replace(/\s+/g, '-');
                  let existing = null;

                  try {
                    existing = await github.rest.teams.getByName({
                      org: org,
                      team_slug: slug
                    });
                  } catch (e) {
                    if (e.status !== 404) throw e;
                  }

                  if (existing) {
                    // Update existing team
                    await github.rest.teams.updateInOrg({
                      org: org,
                      team_slug: slug,
                      name: team.name,
                      description: team.description,
                      privacy: 'closed'
                    });
                    console.log(`    ✓ Updated team: ${team.name}`);
                  } else {
                    // Create new team
                    await github.rest.teams.create({
                      org: org,
                      name: team.name,
                      description: team.description,
                      privacy: 'closed'
                    });
                    console.log(`    ✓ Created team: ${team.name}`);
                  }
                } catch (error) {
                  core.error(`Failed to sync team ${team.name}: ${error.message}`);
                }
              }
            }

            console.log('\nTeam sync complete.');
