name: Sync GitHub Teams

on:
  push:
    branches: [f/f1]
    paths:
      - 'teams-config.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-teams:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create/Update teams and sync repo access
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          pip install requests pyyaml > /dev/null 2>&1
          python3 << 'EOF'
          import os
          import yaml
          import requests
          import sys

          token = os.environ['GH_TOKEN']

          with open('teams-config.yml') as f:
              config = yaml.safe_load(f)

          # Load repos registry to know which repos belong to which product
          registry = {}
          if os.path.exists('repos-registry.yml'):
              with open('repos-registry.yml') as f:
                  registry = yaml.safe_load(f) or {}

          repos_list = registry.get('repositories', [])

          org = config['org']
          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
          }

          def get_permission(name):
              if name.endswith('-Admin'):
                  return 'admin'
              elif name.endswith('-Maintainer'):
                  return 'maintain'
              elif name.endswith('-Developer') or name.endswith('-Collaborator'):
                  return 'push'
              elif name.endswith('-Reader'):
                  return 'pull'
              return 'pull'

          print(f'Organization: {org}')

          for product in config.get('teams', []):
              product_name = product['product']
              print(f'\nProduct: {product_name}')

              # Find repos that belong to this product (by checking teams membership)
              product_repos = []
              for repo in repos_list:
                  repo_teams = repo.get('teams', [])
                  # A repo belongs to this product if any of its teams match
                  product_team_names = [t['name'] for t in product.get('teams', [])]
                  if any(t in product_team_names for t in repo_teams):
                      product_repos.append(repo['name'])

              for team in product.get('teams', []):
                  name = team['name']
                  description = team.get('description', '')
                  slug = name.lower().replace(' ', '-')

                  print(f'  Processing team: {name}')

                  # Check if team exists
                  r = requests.get(
                      f'https://api.github.com/orgs/{org}/teams/{slug}',
                      headers=headers
                  )

                  is_new_team = False
                  if r.status_code == 200:
                      # Update existing team
                      r = requests.patch(
                          f'https://api.github.com/orgs/{org}/teams/{slug}',
                          headers=headers,
                          json={
                              'name': name,
                              'description': description,
                              'privacy': 'closed'
                          }
                      )
                      if r.status_code == 200:
                          print(f'    ✓ Updated team: {name}')
                      else:
                          print(f'    ::error::Failed to update {name}: {r.status_code} {r.text}')
                  elif r.status_code == 404:
                      # Create new team
                      is_new_team = True
                      r = requests.post(
                          f'https://api.github.com/orgs/{org}/teams',
                          headers=headers,
                          json={
                              'name': name,
                              'description': description,
                              'privacy': 'closed'
                          }
                      )
                      if r.status_code == 201:
                          print(f'    ✓ Created team: {name}')
                      else:
                          print(f'    ::error::Failed to create {name}: {r.status_code} {r.text}')
                          continue
                  else:
                      print(f'    ::error::Failed to check team {name}: {r.status_code} {r.text}')
                      continue

                  # Grant new team access to all existing repos of this product
                  if is_new_team and product_repos:
                      permission = get_permission(name)
                      print(f'    Granting {permission} access to {len(product_repos)} existing repo(s)...')
                      for repo_name in product_repos:
                          r = requests.put(
                              f'https://api.github.com/orgs/{org}/teams/{slug}/repos/{org}/{repo_name}',
                              headers=headers,
                              json={'permission': permission}
                          )
                          if r.status_code in (200, 204):
                              print(f'      ✓ {repo_name} → {permission}')
                          else:
                              print(f'      ::error::Failed {repo_name}: {r.status_code} {r.text}')

          print('\nTeam sync complete.')
          EOF

      - name: Remove deleted teams from repos and GitHub
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          python3 << 'EOF'
          import os
          import yaml
          import requests

          token = os.environ['GH_TOKEN']

          with open('teams-config.yml') as f:
              config = yaml.safe_load(f)

          org = config['org']
          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
          }

          # Build set of all team names currently in config
          config_teams = set()
          for product in config.get('teams', []):
              for team in product.get('teams', []):
                  config_teams.add(team['name'])

          # Build set of all known prefixes from products in config
          # to identify teams that belong to our managed products
          product_prefixes = set()
          for product in config.get('teams', []):
              prod_name = product.get('product', '')
              if prod_name:
                  product_prefixes.add(prod_name)

          # Load registry to find teams that were previously assigned
          registry_file = 'repos-registry.yml'
          registry = {}
          if os.path.exists(registry_file):
              with open(registry_file) as f:
                  registry = yaml.safe_load(f) or {}

          repos = registry.get('repositories', [])

          # Find teams in registry that are no longer in config
          removed_teams = set()
          for repo in repos:
              for team_name in repo.get('teams', []):
                  if team_name not in config_teams:
                      removed_teams.add(team_name)

          # Also check GitHub org teams that match our product naming pattern
          # but are no longer in config (catches teams never assigned to repos)
          page = 1
          while True:
              r = requests.get(
                  f'https://api.github.com/orgs/{org}/teams',
                  headers=headers,
                  params={'per_page': 100, 'page': page}
              )
              if r.status_code != 200:
                  print(f'::warning::Could not list org teams: {r.status_code}')
                  break
              teams_page = r.json()
              if not teams_page:
                  break
              for team in teams_page:
                  team_name = team['name']
                  # Check if this team belongs to one of our managed products
                  for prod_name in product_prefixes:
                      if team_name.startswith(prod_name + '-'):
                          if team_name not in config_teams:
                              removed_teams.add(team_name)
                          break
              page += 1

          if not removed_teams:
              print('No teams removed from config.')
              exit(0)

          print(f'Teams removed from config: {", ".join(sorted(removed_teams))}')

          # Remove access from repos and delete teams
          for team_name in removed_teams:
              slug = team_name.lower().replace(' ', '-')
              print(f'\n  Removing team: {team_name}')

              # Remove from all repos that have it
              for repo in repos:
                  if team_name in repo.get('teams', []):
                      repo_name = repo['name']
                      r = requests.delete(
                          f'https://api.github.com/orgs/{org}/teams/{slug}/repos/{org}/{repo_name}',
                          headers=headers
                      )
                      if r.status_code in (204, 404):
                          print(f'    ✗ Revoked access from: {repo_name}')
                      else:
                          print(f'    ::warning::Could not revoke from {repo_name}: {r.status_code}')

              # Delete the team from GitHub
              r = requests.delete(
                  f'https://api.github.com/orgs/{org}/teams/{slug}',
                  headers=headers
              )
              if r.status_code == 204:
                  print(f'    ✓ Deleted team from GitHub: {team_name}')
              elif r.status_code == 404:
                  print(f'    Team already gone: {team_name}')
              else:
                  print(f'    ::error::Failed to delete {team_name}: {r.status_code} {r.text}')

          print('\nTeam removal complete.')
          EOF

      - name: Update repos registry (add new / remove deleted teams)
        run: |
          python3 << 'EOF'
          import os
          import yaml

          with open('teams-config.yml') as f:
              config = yaml.safe_load(f)

          registry_file = 'repos-registry.yml'
          if not os.path.exists(registry_file):
              print('No registry file found, skipping.')
              exit(0)

          with open(registry_file) as f:
              registry = yaml.safe_load(f) or {}

          repos = registry.get('repositories', [])
          if not repos:
              print('No repos in registry, skipping.')
              exit(0)

          # Build product → team names map and full set of valid teams
          product_teams = {}
          all_config_teams = set()
          for product in config.get('teams', []):
              team_names = [t['name'] for t in product.get('teams', [])]
              product_teams[product['product']] = team_names
              all_config_teams.update(team_names)

          updated = False
          for repo in repos:
              current_teams = repo.get('teams', [])

              # Remove teams no longer in config
              new_teams = [t for t in current_teams if t in all_config_teams]
              if len(new_teams) != len(current_teams):
                  removed = set(current_teams) - set(new_teams)
                  for t in removed:
                      print(f'  Removed {t} from {repo["name"]}')
                  updated = True

              # Find which product this repo belongs to and add new teams
              for prod_name, team_names in product_teams.items():
                  if any(t in team_names for t in new_teams):
                      for team_name in team_names:
                          if team_name not in new_teams:
                              new_teams.append(team_name)
                              updated = True
                              print(f'  Added {team_name} to {repo["name"]}')
                      break

              repo['teams'] = new_teams

              # Remove deleted teams from cross_team_access
              current_cross = repo.get('cross_team_access', [])
              new_cross = [t for t in current_cross if t in all_config_teams]
              if len(new_cross) != len(current_cross):
                  removed_cross = set(current_cross) - set(new_cross)
                  for t in removed_cross:
                      print(f'  Removed {t} from cross_team_access of {repo["name"]}')
                  updated = True
              repo['cross_team_access'] = new_cross

          if updated:
              registry['repositories'] = repos
              with open(registry_file, 'w') as f:
                  f.write('# Repository Registry — Source of Truth\n')
                  f.write('# Auto-updated by GitHub Actions on repo creation, update, and cross-team access grants.\n\n')
                  yaml.dump(registry, f, default_flow_style=False, sort_keys=False)
              print('✓ Registry updated.')
          else:
              print('Registry already up to date.')
          EOF

      - name: Commit registry if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repos-registry.yml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "registry: sync new teams to existing repos [skip ci]"
          git push

      - name: Export team members to JSON
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          python3 << 'EOF'
          import os
          import json
          import yaml
          import requests

          token = os.environ['GH_TOKEN']

          with open('teams-config.yml') as f:
              config = yaml.safe_load(f)

          org = config['org']
          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
          }

          team_members = {}

          for product in config.get('teams', []):
              for team in product.get('teams', []):
                  name = team['name']
                  slug = name.lower().replace(' ', '-')
                  members = []
                  page = 1
                  while True:
                      r = requests.get(
                          f'https://api.github.com/orgs/{org}/teams/{slug}/members',
                          headers=headers,
                          params={'per_page': 100, 'page': page}
                      )
                      if r.status_code != 200:
                          print(f'  Warning: Could not fetch members for {name}: {r.status_code}')
                          break
                      page_members = r.json()
                      if not page_members:
                          break
                      members.extend([m['login'] for m in page_members])
                      page += 1
                  team_members[name] = sorted(members)
                  print(f'  {name}: {len(members)} member(s)')

          with open('team-members.json', 'w') as f:
              json.dump(team_members, f, indent=2)

          print(f'\n✓ Exported {len(team_members)} teams to team-members.json')
          EOF

      - name: Commit team members
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add team-members.json
          git diff --cached --quiet && echo "No changes to team members" && exit 0
          git commit -m "sync: update team-members.json [skip ci]"
          git push
